input:
  mode: embedding   # embedding | raw

labels:
  num_classes: 9
  ignore_index: 255
  background_index: 0
  ignore_background_in_metrics: true
  ignore_background_in_dice: true

model:
  variant: basic    # basic | resse | lightweight | aspp
  depth: 4
  base_channels: 16
  norm: group
  dropout: 0.1


train:
  epochs: 200
  batch_size: 2
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  val_interval: 2
  lr: 1e-4
  weight_decay: 1e-4
  seed: 42
  val_fraction: 0.2
  early_stop_patience: 10
  scheduler: poly
  scheduler_power: 0.9
  scheduler_monitor: val_miou
  lr_patience: 5
  lr_decay_factor: 0.5
  min_lr: 1e-6
  validate_first_epoch: false

  dice_weight: 0.0
  ce_weight: 1.0
  focal_gamma: 0.0
  focal_class_weights: ""
  focal_focus_classes: all_fg

  save_val_samples: 0


data:
  resample_size: 0
  normalize_features: false
  feature_stats_max_samples: 0

  enable_augmentation: true
  train_repeat_factor: 1
  aug_flip_prob: 0.5
  aug_rot90_prob: 0.5
  aug_noise_std: 0.01
  aug_gain_std: 0.05
  train_crop_size: 512
  pad_to_size: 512
  fg_crop_prob: 0.8

  use_fg_sampler: true
  fg_sampler_power: 2.0
  fg_sampler_min_weight: 0.5

runtime:
  device: cuda:0
  output_dir: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/result/outputs_AEF
  resume: false
  resume_checkpoint: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/result/outputs_raw_resse/checkpoints/latest.pt
  resume_strict: true
  amp: true
  cudnn_benchmark: true
  allow_tf32: true
  channels_last: true
  pin_memory: true
  matmul_precision: high

# embedding 模式数据路径
embedding:
  embedding_key: embeddings
  per_patch_labels: false
  train_embeddings_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/embeddings/AEF_npz/train
  train_labels_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12/train_labels_npz
  val_embeddings_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/embeddings/AEF_npz/val
  val_labels_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12/val_labels_npz

# raw 模式数据路径（input.mode=raw 时使用）
raw:
  dataset_root: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12
  label_root: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12
  train_split: train
  val_split: test
  s1_key: sentinel1
  s2_key: sentinel2
  label_key: labels
  time_steps: 12

# 可选：自动网格搜索（先手动可置 false）
search:
  enabled: true
  grid:
    train.lr: [1e-6, 1e-2]
    model.base_channels: [8, 32]
    train.dice_weight: [0.3, 0.4]
