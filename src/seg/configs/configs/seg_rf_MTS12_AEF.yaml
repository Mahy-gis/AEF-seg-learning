input:
  mode: embedding   # embedding | raw

labels:
  num_classes: 9
  ignore_index: 255
  background_index: 0
  ignore_background_in_metrics: true

rf:
  backend: gpu
  n_estimators: 300
  max_features_mode: input_channels   # input_channels | fixed
  max_features_value: 64               # used only when max_features_mode=fixed
  min_samples_leaf: 1
  bootstrap: true
  max_samples: 1.0
  random_state: 42
  n_jobs: -1
  verbose: 0

data:
  resample_size: 0
  val_fraction: 0.2
  max_train_pixels_per_image: 2048
  max_train_pixels_total: 200000
  save_val_samples: 4

train:
  seed: 42

runtime:
  device: cuda
  output_dir: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/result/rf_outputs_S12

embedding:
  embedding_key: auto
  per_patch_labels: false
  train_embeddings_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/embeddings/S12/train
  train_labels_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12/train_labels_npz
  val_embeddings_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/embeddings/S12/val
  val_labels_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12/val_labels_npz

raw:
  dataset_root: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12
  label_root: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12
  train_split: train
  val_split: val
  s1_key: sentinel1
  s2_key: sentinel2
  label_key: labels
  time_steps: 12