input:
  mode: embedding   # embedding | raw

labels:
  num_classes: 9
  ignore_index: 255
  background_index: 0
  ignore_background_in_metrics: true
  ignore_background_in_dice: true

model:
  variant: basic    # basic | resse | lightweight | aspp
  depth: 4
  base_channels: 4
  norm: group
  dropout: 0.1

train:
  epochs: 50
  batch_size: 4
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  val_interval: 1
  lr: 5e-5
  weight_decay: 1e-4
  seed: 42
  val_fraction: 0.2
  early_stop_patience: 0
  scheduler_monitor: val_miou
  lr_patience: 5
  lr_decay_factor: 0.5
  min_lr: 1e-6

  dice_weight: 0.4
  ce_weight: 0.0
  focal_gamma: 2.0
  focal_class_weights: "3,1,1.5,3,3,2,3,2,3"
  focal_focus_classes: all_fg

  save_val_samples: 6

data:
  resample_size: 0
  normalize_features: true
  feature_stats_max_samples: 0

  enable_augmentation: true
  train_repeat_factor: 1
  aug_flip_prob: 0.5
  aug_rot90_prob: 0.5
  aug_noise_std: 0.01
  aug_gain_std: 0.05
  train_crop_size: 500
  fg_crop_prob: 0.8

  use_fg_sampler: false
  fg_sampler_power: 1.5
  fg_sampler_min_weight: 0.2

runtime:
  device: cuda
  output_dir: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/result/outputs_unified_example
  resume: false
  resume_checkpoint: ""
  resume_strict: true
  amp: true
  cudnn_benchmark: true
  allow_tf32: true
  channels_last: true
  matmul_precision: high

# embedding 模式数据路径
embedding:
  embedding_key: embeddings
  per_patch_labels: false
  train_embeddings_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/embeddings/AEF_npz/train
  train_labels_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12/train_labels_npz
  val_embeddings_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/embeddings/AEF_npz/val
  val_labels_path: /mnt/data/mhy/RSFM/AEF-seg-learning/data/MTS12/S12/val_labels_npz

# raw 模式数据路径（input.mode=raw 时使用）
raw:
  dataset_root: /mnt/data/mhy/RSFM/AEF-seg-learning/data/PASTIS-R/raw
  label_root: /mnt/data/mhy/RSFM/AEF-seg-learning/data/PASTIS-R/annotation
  train_split: train
  val_split: val
  s1_key: sentinel1
  s2_key: sentinel2
  label_key: labels
  time_steps: 12

# 可选：自动网格搜索（先手动可置 false）
search:
  enabled: false
  grid:
    train.lr: [5e-5, 1e-4]
    model.base_channels: [4, 8]
    train.dice_weight: [0.3, 0.4]
